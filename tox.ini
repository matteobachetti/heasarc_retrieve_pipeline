[tox]
envlist =
    py{310,311,312,313,314}-test{,-alldeps,-devdeps}{,-cov}
    build_docs
    linkcheck
    codestyle
    check-build
requires =
    setuptools >= 30.3.0
    pip >= 19.3.1
isolated_build = true

[testenv]
# tox environments are built out of 'factors' separated by hyphens, e.g.
# py312-test-alldeps-cov. A line below starting with `factor:` only takes effect if that
# factor is in the environment name. To list the environments with their descriptions:
#
#     tox -l -v
#
description =
    run tests
    alldeps: with every optional dependency
    devdeps: against the development version of astropy and astroquery
    cov: and measure coverage
    slow: running only the tests marked slow
    remote: including the tests that need the network

# Pass through what the CI and a local HEASOFT installation need
passenv =
    HOME
    WINDIR
    LC_ALL
    LC_CTYPE
    CC
    CI
    HEADAS
    CALDB
    PFILES

set_env =
    # Suppress display of matplotlib plots generated during the docs build
    MPLBACKEND = agg
    # Expensive tests are deselected by default; these two factors are how CI asks for
    # them. Run them in separate environments -- the last matching line wins.
    slow: PYTEST_ADDOPTS = --run-slow -m slow
    remote: PYTEST_ADDOPTS = --remote-data

# Run the tests in a temporary directory, so that the package under test is the installed
# one and not the source tree next door.
change_dir = .tmp/{envname}

deps =
    cov: pytest-cov
    devdeps: git+https://github.com/astropy/astropy.git#egg=astropy
    devdeps: git+https://github.com/astropy/astroquery.git#egg=astroquery

extras =
    test
    alldeps: all

# `-c` is what makes the settings in pyproject.toml apply from the temporary directory.
# Without it pytest finds no configuration file, `doctest_plus` stays off, and the 47
# doctests in the package are silently not collected.
commands =
    pip freeze
    !cov: pytest -c {toxinidir}/pyproject.toml --pyargs heasarc_retrieve_pipeline {toxinidir}/docs {posargs}
    cov: pytest -c {toxinidir}/pyproject.toml --pyargs heasarc_retrieve_pipeline {toxinidir}/docs --cov heasarc_retrieve_pipeline --cov-config={toxinidir}/pyproject.toml --cov-report term-missing --cov-report xml:{toxinidir}/coverage.xml {posargs}

[testenv:build_docs]
description = invoke sphinx-build to build the HTML docs
change_dir = docs
extras = docs
commands =
    pip freeze
    sphinx-build -W -b html . _build/html

[testenv:linkcheck]
description = check that the links in the docs still resolve
change_dir = docs
extras = docs
commands =
    pip freeze
    sphinx-build -W -b linkcheck . _build/linkcheck

[testenv:codestyle]
description = check code style with ruff
change_dir = .
skip_install = true
deps = ruff
commands =
    ruff check src/heasarc_retrieve_pipeline docs
    ruff format --check src/heasarc_retrieve_pipeline docs

[testenv:check-build]
description = check that the sdist builds and its metadata is valid
change_dir = .
skip_install = true
deps =
    build
    twine
commands =
    python -m build --sdist --outdir {toxinidir}/dist .
    twine check {toxinidir}/dist/*
