[project]
name = "heasarc_retrieve_pipeline"
description = "Pipeline to automatically retrieve data from HEASARC"
readme = "README.rst"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["licenses/LICENSE.rst"]
authors = [
  { name = "Matteo Bachetti", email = "matteo@matteobachetti.it" },
]
# Everything needed to import the package, query HEASARC, download an observation and
# run a reduction. Anything imported inside a function belongs in an extra below.
dependencies = [
  "astropy",
  "numpy",
  "astroquery",
  "pyvo",
  "prefect",
  "pysmartdl",
  "beautifulsoup4",
  "pyyaml",
]
dynamic = ["version"]

[project.optional-dependencies]
# Source/background splitting from sky images (heasarc_retrieve_pipeline.image_utils)
imaging = ["scikit-image", "scipy", "statsmodels"]
# ds9 region files for the nuproducts spectral path
regions = ["regions"]
# Anonymous S3 transport, used by recursive_download when the archive offers it
s3 = ["boto3"]
# The HTML observation pages written by hrp-report
report = ["plotly"]
# Solar flare filtering and SNR-optimised extraction regions
solar = ["sunpy", "nustar_gen"]
all = [
    "scikit-image",
    "scipy",
    "statsmodels",
    "regions",
    "boto3",
    "plotly",
    "sunpy",
    "nustar_gen",
]
test = [
    "pytest",
    "pytest-astropy",
]
docs = [
    "sphinx",
    "sphinx-automodapi",
    "tomli; python_version <\"3.11\"",
]


[project.scripts]
hrp-split-obsid = "heasarc_retrieve_pipeline.segments:main"
hrp-merge-obsids = "heasarc_retrieve_pipeline.combine:main"
hrp-report = "heasarc_retrieve_pipeline.report:main"
hrp-check-roundtrip = "heasarc_retrieve_pipeline.roundtrip:main"


[project.urls]
repository = "http://github.com/matteobachetti/heasarc_retrieve_pipeline"

[build-system]
requires = [
  # 77 is where PEP 639 `license`/`license-files` became available
  "setuptools>=77",
  "setuptools_scm[toml]>=8",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
zip-safe = false
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["heasarc_retrieve_pipeline*"]

[tool.setuptools.package-data]
"heasarc_retrieve_pipeline" = ["data/*"]

[tool.setuptools_scm]
version_file = "src/heasarc_retrieve_pipeline/_version.py"

[tool.pytest.ini_options]
testpaths = [
  "src/heasarc_retrieve_pipeline",
  "docs",
]
doctest_plus = "enabled"
text_file_format = "rst"
addopts = "--doctest-rst"

[tool.coverage.run]
omit = [
 "src/heasarc_retrieve_pipeline/__init*",
 "src/heasarc_retrieve_pipeline/conftest.py",
 "src/heasarc_retrieve_pipeline/*setup_package*",
 "src/heasarc_retrieve_pipeline/tests/*",
 "src/heasarc_retrieve_pipeline/*/tests/*",
 "src/heasarc_retrieve_pipeline/extern/*",
 "src/heasarc_retrieve_pipeline/version*",
 "*/heasarc_retrieve_pipeline/__init*",
 "*/heasarc_retrieve_pipeline/conftest.py",
 "*/heasarc_retrieve_pipeline/*setup_package*",
 "*/heasarc_retrieve_pipeline/tests/*",
 "*/heasarc_retrieve_pipeline/*/tests/*",
 "*/heasarc_retrieve_pipeline/extern/*",
 "*/heasarc_retrieve_pipeline/version*",
]

[tool.coverage.report]
exclude_lines = [
  # Have to re-enable the standard pragma
  "pragma: no cover",
  # Don't complain about packages we have installed
  "except ImportError",
  # Don't complain if tests don't hit assertions
  "raise AssertionError",
  "raise NotImplementedError",
  # Don't complain about script hooks
  "def main(.*):",
  # Ignore branches that don't pertain to this version of Python
  "pragma: py{ignore_python_version}",
  # Don't complain about IPython completion helper
  "def _ipython_key_completions_",
]
